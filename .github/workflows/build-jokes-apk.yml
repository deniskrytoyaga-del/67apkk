name: Build Jokes Generator APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build jokes APK
        run: gradle --no-daemon :jokes-app:assembleDebug

      - name: Prepare APK
        run: cp jokes-app/build/outputs/apk/debug/jokes-app-debug.apk app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 67-jokes-generator-android
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jokes-latest
          name: 67 Jokes Generator Android
          body: "Отдельное приложение генератора шуток 67 для Android."
          files: app-debug.apk
          overwrite_files: true
          make_latest: false
